server {
    listen 8080;
    server_name lic.nut.run;
    absolute_redirect off;
    client_max_body_size 105m;
    client_body_timeout 120s;

    # Preserve the existing arcade files without putting application data here.
    location = /previous-site { return 302 /previous-site/; }
    location /previous-site/ { alias /legacy/; index index.html; }
    location = /neon-drift.html { return 302 /previous-site/; }
    location = /boom { return 302 /previous-site/; }
    location /boom/ { return 302 /previous-site/; }

    location / {
        proxy_pass http://listed-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
