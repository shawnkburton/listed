services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LISTED_PUBLIC_ORIGIN: https://lic.nut.run
      LISTED_DATABASE_PATH: /var/lib/listed/marketplace.sqlite
      LISTED_VIDEO_DIRECTORY: /var/lib/listed/videos
    volumes:
      - ./.data:/var/lib/listed
    expose:
      - "3000"
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/marketplace').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
